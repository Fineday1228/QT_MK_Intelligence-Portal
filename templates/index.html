<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantec Market Intelligence Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-base: #0B0E14;
            --surface: rgba(30, 33, 40, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.1), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-placeholder {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .logo-img {
            max-height: 40px;
            object-fit: contain;
            display: none; /* Shown via JS if exists */
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: #E5E7EB;
        }

        .date-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--surface-border);
            color: white;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color-scheme: dark;
            transition: all 0.2s;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--surface-border);
            margin-bottom: 1.5rem;
        }
        
        .toggle-text {
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .checkbox-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .checkbox-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .checkbox-card.selected {
            background: rgba(79, 70, 229, 0.1);
            border-color: var(--primary);
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.1rem;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #statusText {
            display: none;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            <div class="header">
                <!-- User logo should be placed in static/img/logo_white.png -->
                <div class="logo-placeholder" id="logoContainer">
                    <img src="{{ url_for('static', filename='img/logo_white.png') }}" class="logo-img" id="mainLogo" alt="Quantec Logo" onerror="this.onerror=null; this.style.display='none'; document.getElementById('logoText').style.display='block';">
                    <span id="logoText" style="display: none;">Quantec</span>
                </div>
                <h2>Market Intelligence Portal</h2>
                <p>Select parameters to extract financial data.</p>
            </div>

            <div class="form-group">
                <label class="form-label">Target Date</label>
                <input type="date" id="targetDate" class="date-input" required>
            </div>

            <div class="form-group">
                <label class="form-label">Data Scope</label>
                
                <label class="toggle-group">
                    <span class="toggle-text">Comprehensive News (All Categories)</span>
                    <label class="switch">
                        <input type="checkbox" id="fetchNews" checked>
                        <span class="slider"></span>
                    </label>
                </label>
            </div>
            
            <div class="form-group">
                <label class="form-label">Research Reports</label>
                <div class="checkbox-grid">
                    <div class="checkbox-card selected" data-value="시황">시황</div>
                    <div class="checkbox-card selected" data-value="투자">투자</div>
                    <div class="checkbox-card selected" data-value="경제">경제</div>
                    <div class="checkbox-card selected" data-value="채권">채권</div>
                    <div class="checkbox-card selected" data-value="종목">종목</div>
                    <div class="checkbox-card selected" data-value="산업">산업</div>
                </div>
            </div>

            <button class="btn-submit" id="generateBtn" onclick="generateData()">
                <span>Generate & Download</span>
                <div class="loader" id="loader"></div>
            </button>
            <p id="statusText">Crawling in progress. This may take up to 2-3 minutes...</p>

        </div>
    </div>

    <script>
        // Check image load
        const img = document.getElementById('mainLogo');
        img.onload = () => { img.style.display = 'block'; };

        // Set date to today
        document.getElementById('targetDate').valueAsDate = new Date();

        // Checkbox interaction
        document.querySelectorAll('.checkbox-card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('selected');
            });
        });

        async function generateData() {
            const dateStr = document.getElementById('targetDate').value;
            const fetchNews = document.getElementById('fetchNews').checked;
            
            const selectedReports = Array.from(document.querySelectorAll('.checkbox-card.selected'))
                                       .map(el => el.getAttribute('data-value'));

            if (!dateStr) {
                alert("Please select a date.");
                return;
            }

            if (!fetchNews && selectedReports.length === 0) {
                alert("Please select at least one data source.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('statusText');
            const btnSpan = btn.querySelector('span');

            // UI Loading state
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btnSpan.innerText = 'Extracting...';
            loader.style.display = 'block';
            statusText.style.display = 'block';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        date: dateStr,
                        fetch_news: fetchNews,
                        reports: selectedReports
                    })
                });

                if (response.ok) {
                    // Trigger download
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    
                    // Format date for filename
                    const cleanDate = dateStr.replace(/-/g, '');
                    a.download = `Quantec_Data_${cleanDate}.zip`;
                    
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    alert("An error occurred during extraction.");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Network error.");
            } finally {
                // Reset UI
                btn.disabled = false;
                btn.style.opacity = '1';
                btnSpan.innerText = 'Generate & Download';
                loader.style.display = 'none';
                statusText.style.display = 'none';
            }
        }
    </script>
</body>
</html>
